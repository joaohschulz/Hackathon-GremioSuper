<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <div class="login-container">
        <h2>Entrar</h2>

        {% if form.errors %}
            <p style="color: red;">Usuário ou senha incorretos. Tente novamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit">Entrar</button>
        </form>

        <p>
            <a href="{% url 'password_reset' %}">Esqueceu a senha?</a>
        </p>
    </div>

</body>
</html>
